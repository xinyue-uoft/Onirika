[project]
name = "onirika-ssh"
version = "0.1.0"
description = "MCP server for remote SSH file and command operations via ControlMaster"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0,<2",  # 2.0 removed mcp.server.fastmcp
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "websockets>=12.0",
    "asyncssh>=2.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
onirika = "onirika.cli:main"
onirika-ssh = "onirika.__main__:main"
onirika-setup = "onirika.setup:main"
onirika-web = "onirika.web.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["onirika"]
artifacts = ["onirika/scripts/*.sh"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
